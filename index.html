<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة مصاريف السكن</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6ea;--pos:#0a7d43;--neg:#c62828;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#eef0f3;--mut:#9aa3ae;--bd:#2d333b;--pos:#4cd18a;--neg:#ff7b72;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#eef0f3;--mut:#9aa3ae;--bd:#2d333b;--pos:#4cd18a;--neg:#ff7b72;--ac:#6ea0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding:16px}
.w{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.sec{font-weight:700;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
label.l{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select{width:100%;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);cursor:pointer}
.chip input{width:auto;margin:0}
button{font:inherit;padding:11px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;cursor:pointer}
.full{width:100%;margin-top:12px}
.ghost{background:var(--bd);color:var(--tx)}
.del{background:none;color:var(--neg);padding:4px 8px}
.ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.ex:last-child{border:0}
.ex .n{font-weight:600}
.ex .r{display:flex;align-items:center;gap:6px;direction:ltr;font-weight:700}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{text-align:center}
.sum small{color:var(--mut);display:block}
.sum b{font-size:22px}
.res{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.res:last-child{border:0}
.res small{display:block;color:var(--mut)}
.res .a{font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}
</style>
</head>
<body>
<div class="w">
<h1>🧾 حاسبة مصاريف السكن</h1>

<div class="card">
<p class="sec">إضافة مشترى</p>
<label class="l" for="desc">اسم المنتج / الوصف</label>
<input id="desc" type="text" placeholder="مثال: خبز" autocomplete="off">
<div class="two">
<div><label class="l" for="amt">المبلغ</label><input id="amt" type="text" inputmode="decimal" dir="ltr" placeholder="0" autocomplete="off"></div>
<div><label class="l" for="payer">من دفع؟</label><select id="payer"></select></div>
</div>
<label class="l">يُقسَّم على</label>
<div class="chips" id="chips"></div>
<button class="full" id="add" type="button">إضافة المشترى</button>
<p class="mut" id="msg"></p>
</div>

<div class="card">
<p class="sec">المشتريات</p>
<div id="list"></div>
<div class="sum" style="margin-top:10px;grid-template-columns:1fr"><div><small>المجموع الكلي</small><b id="total">0</b></div></div>
</div>

<div class="card">
<p class="sec">الحساب لكل شخص</p>
<div id="results"></div>
</div>

<div class="card">
<p class="sec">مجموع المبالغ اللي عليهم</p>
<div class="sum" style="grid-template-columns:1fr"><div><small>المجموع المطلوب دفعه</small><b id="owed" class="neg">0</b></div></div>
<p class="sec" style="margin-top:12px">يرجع لهم من هذا المبلغ</p>
<div id="back"></div>
</div>

<button class="ghost" id="clr" type="button">مسح كل المشتريات</button>
<p class="mut">الحفظ على نفس الجهاز والمتصفح فقط.</p>
</div>
<script>
var names=["عبيدة","يعقوب","أنس","حيدر","أحمد"];
var ex=[],KEY="roommates-expenses-v1";
try{var sv=localStorage.getItem(KEY);if(sv)ex=JSON.parse(sv)||[]}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ex))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function f(n){return (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2})}
function num(v){
  v=(v||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[٫,،]/g,".");
  var n=parseFloat(v);return isNaN(n)?0:n;
}
names.forEach(function(n,i){
  var o=document.createElement("option");o.value=i;o.textContent=n;$("payer").appendChild(o);
  var l=document.createElement("label");l.className="chip";
  l.innerHTML='<input type="checkbox" class="sp" value="'+i+'" checked>'+n;
  $("chips").appendChild(l);
});
$("add").addEventListener("click",function(){
  var a=num($("amt").value),d=$("desc").value.trim();
  var s=[].slice.call(document.querySelectorAll(".sp")).filter(function(c){return c.checked}).map(function(c){return +c.value});
  if(!(a>0)){$("msg").textContent="اكتب مبلغ صحيح.";return}
  if(!s.length){$("msg").textContent="اختر شخص واحد على الأقل للتقسيم.";return}
  ex.push({d:d||"مشترى",a:a,p:+$("payer").value,s:s});
  $("desc").value="";$("amt").value="";$("msg").textContent="";
  document.querySelectorAll(".sp").forEach(function(c){c.checked=true});
  save();render();
});
function del(i){ex.splice(i,1);save();render()}
var armed=false;
$("clr").addEventListener("click",function(){
  if(!armed){armed=true;this.textContent="اضغط مرة ثانية للتأكيد";var b=this;setTimeout(function(){armed=false;b.textContent="مسح كل المشتريات"},3000);return}
  ex=[];armed=false;this.textContent="مسح كل المشتريات";save();render();
});
function render(){
  var paid=names.map(function(){return 0}),share=names.map(function(){return 0}),total=0;
  ex.forEach(function(e){
    total+=e.a;paid[e.p]+=e.a;
    e.s.forEach(function(i){share[i]+=e.a/e.s.length});
  });
  $("total").textContent=f(total);
  $("list").innerHTML=ex.length?ex.map(function(e,i){
    return '<div class="ex"><div><div class="n">'+esc(e.d)+'</div><div class="mut">دفع '+names[e.p]+' · على '+(e.s.length==names.length?"الجميع":e.s.map(function(k){return names[k]}).join("، "))+'</div></div><div class="r"><button class="del" data-i="'+i+'" type="button">حذف</button><span>'+f(e.a)+'</span></div></div>';
  }).join(""):'<span class="mut">ما في مشتريات بعد.</span>';
  document.querySelectorAll(".del").forEach(function(b){b.addEventListener("click",function(){del(+b.getAttribute("data-i"))})});
  var bal=names.map(function(_,i){return Math.round((paid[i]-share[i])*100)/100});
  $("results").innerHTML=names.map(function(n,i){
    var b=bal[i],c=b>0.004?"pos":(b<-0.004?"neg":""),t=b>0.004?"يرجع له "+f(b):(b<-0.004?"عليه "+f(-b):"متساوي");
    return '<div class="res"><span>'+n+'<small>دفع '+f(paid[i])+' · حصته '+f(share[i])+'</small></span><span class="a '+c+'">'+t+'</span></div>';
  }).join("");
  var owed=0,h="";
  bal.forEach(function(b){if(b<-0.004)owed+=-b});
  names.forEach(function(n,i){if(bal[i]>0.004)h+='<div class="res"><span>'+n+'</span><span class="a pos">'+f(bal[i])+'</span></div>'});
  $("owed").textContent=f(owed);
  $("back").innerHTML=h||'<span class="mut">لا يوجد</span>';
}
render();
</script>
</body>
</html>
